name: green_bite
description: GreenBite - Healthy food ordering UI
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: any
  shared_preferences: any
  iconly: any
  flutter_animate: 4.5.2
  flutter_3d_controller: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locale/
    - assets/models/
