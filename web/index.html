<!DOCTYPE html>
<html>
  <head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Greenly Flutter Web App">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Greenly">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/42A047/FFFFFF?text=G">
    <link rel="icon" type="image/png" href="https://via.placeholder.com/512/42A047/FFFFFF?text=G">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#42A047">
    <title>Greenly</title>
    <script>
      if (window.location.host === "localhost" || window.location.host.startsWith("127.")) {
        window.FLUTTER_WEB_USE_SKIA = true;
      }
    </script>
  </head>
  <body>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: new Date().toISOString(),
          },
        }).then(function (engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function (appRunner) {
          return appRunner.runApp();
        });
      });
    </script>
  </body>
</html>
